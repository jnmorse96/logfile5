# Gut & Gain news engine
# Runs every 12 hours. Adds new stories from around the world to every section,
# refreshes the Trial Tracker from ClinicalTrials.gov and PubMed, and commits
# the result to gut-and-gain/public/data/. Vercel redeploys automatically.
#
# This file must live at the TOP of the repository (.github/workflows/) for
# GitHub to find it. The app itself lives in the gut-and-gain/ folder.
#
# Setup (once): repo → Settings → Secrets and variables → Actions
#   Secret   ANTHROPIC_API_KEY   (required)
#   Secret   NCBI_API_KEY        (optional, raises PubMed's rate limit)
#   Variable ANTHROPIC_MODEL     (optional model override)
#   Variable ENGINE_LANGUAGES    (optional, e.g. "es,nl,pt" to pre-translate)
#   Variable NCBI_EMAIL          (optional contact for NCBI)
# Run it any time from the Actions tab → News engine → Run workflow.

name: News engine

on:
  schedule:
    # Every 12 hours: 10:17 and 22:17 UTC (6:17 a.m./p.m. New York in summer)
    - cron: "17 10,22 * * *"
  workflow_dispatch:
    inputs:
      channels:
        description: "Sections to run (comma list: reality,ibd,trials,gainer). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-engine
  cancel-in-progress: false

defaults:
  run:
    working-directory: gut-and-gain

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gut-and-gain/package-lock.json

      - run: npm ci

      - name: Gather new stories and trials
        id: engine
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ENGINE_LANGUAGES: ${{ vars.ENGINE_LANGUAGES }}
          ENGINE_CHANNELS: ${{ github.event.inputs.channels }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
        run: node engine/run.mjs

      # Always publish: new stories on success, and status.json either way, so the
      # site's footer shows when news last updated and whether the latest run failed.
      - name: Publish
        if: always()
        run: |
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "gut-and-gain-engine"
          git config user.email "engine@users.noreply.github.com"
          git add public/data
          git commit -m "News update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      # Mark the run red (and email you) if the engine failed, after publishing its status.
      - name: Report failure
        if: steps.engine.outcome == 'failure'
        run: |
          echo "::error::The news engine failed. Open this run's Summary for the reason and the fix."
          exit 1
